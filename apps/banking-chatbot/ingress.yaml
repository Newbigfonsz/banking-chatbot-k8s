# TLS ingress for banking.alphonzojonesjr.com.
# Added 2026-06-12 to replace the previous plaintext-HTTP `banking-http-only`
# ingress (no TLS) flagged in a platform security audit. ssl-redirect is "false"
# to match the Cloudflare-fronted pattern (Cloudflare terminates TLS; forcing an
# origin redirect to https can cause a redirect loop). Namespace is intentionally
# omitted — ArgoCD applies it to the app destination (default).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - banking.alphonzojonesjr.com
    secretName: banking-tls  # pragma: allowlist secret
  rules:
  - host: banking.alphonzojonesjr.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: banking-chatbot-svc
            port:
              number: 80
